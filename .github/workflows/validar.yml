name: Validar HTML

on:
  pull_request:
    branches: [develop, main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar el HTML
        run: npx --yes html-validate "public/**/*.html"
